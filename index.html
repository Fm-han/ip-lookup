<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP地址查询 - 本机IP及归属地查询</title>
  <meta name="description" content="免费在线IP地址查询工具，显示本机公网IP地址，支持输入IP查询归属地、运营商、地区等信息。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/ip-lookup/">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
    .result-box { background: linear-gradient(135deg, #007bff, #0056b3); border-radius: 12px; padding: 24px; color: #fff; margin: 20px 0; }
    .result-box .ip-address { font-size: 2.5rem; font-weight: 700; }
    .result-box .desc { font-size: 0.9rem; opacity: 0.9; margin-top: 8px; }
    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .info-item { background: #f5f5f5; padding: 16px; border-radius: 8px; }
    .info-item .label { font-size: 0.85rem; color: #666; }
    .info-item .value { font-size: 1.1rem; font-weight: 600; margin-top: 4px; }
    button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .loading::after { content: '查询中...'; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
  <h1>IP地址查询 <small>本机IP · IP归属地 · 运营商查询</small></h1>

  <div class="card">
    <div class="input-group">
      <label>输入IP地址查询归属地</label>
      <input type="text" id="ipInput" placeholder="例如：8.8.8.8 或留空查询本机IP">
    </div>
    <div class="buttons">
      <button class="btn-primary" onclick="lookupIP()">查询</button>
      <button class="btn-secondary" onclick="lookupMyIP()">查询本机IP</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="result-box">
      <div class="ip-address" id="displayIP">--</div>
      <div class="desc" id="ipDesc">IP地址信息</div>
    </div>
    <div class="info-grid" id="infoGrid">
      <div class="info-item"><div class="label">国家/地区</div><div class="value" id="info1">--</div></div>
      <div class="info-item"><div class="label">省份/城市</div><div class="value" id="info2">--</div></div>
      <div class="info-item"><div class="label">运营商</div><div class="value" id="info3">--</div></div>
      <div class="info-item"><div class="label">经纬度</div><div class="value" id="info4">--</div></div>
    </div>
  </div>

  <div class="card">
    <h3>常见DNS服务器IP</h3>
    <table style="width:100%;border-collapse:collapse;">
      <tr style="background:#f0f0f0;"><th style="padding:8px;border:1px solid #ddd;">服务商</th><th style="padding:8px;border:1px solid #ddd;">DNS IP</th></tr>
      <tr><td style="padding:8px;border:1px solid #ddd;">Google DNS</td><td style="padding:8px;border:1px solid #ddd;">8.8.8.8 / 8.8.4.4</td></tr>
      <tr><td style="padding:8px;border:1px solid #ddd;">Cloudflare</td><td style="padding:8px;border:1px solid #ddd;">1.1.1.1 / 1.0.0.1</td></tr>
      <tr><td style="padding:8px;border:1px solid #ddd;">阿里DNS</td><td style="padding:8px;border:1px solid #ddd;">223.5.5.5 / 223.6.6.6</td></tr>
      <tr><td style="padding:8px;border:1px solid #ddd;">腾讯DNS</td><td style="padding:8px;border:1px solid #ddd;">119.29.29.29</td></tr>
    </table>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    async function lookupIP(ip) {
      const targetIP = ip || document.getElementById('ipInput').value.trim();
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('displayIP').textContent = targetIP || '查询中...';
      try {
        const response = await fetch(`https://ipapi.co/${targetIP || 'json/'}`, { mode: 'cors' });
        const data = await response.json();
        document.getElementById('info1').textContent = (data.country_name || data.country) + (data.country_capital ? ' / ' + data.country_capital : '');
        document.getElementById('info2').textContent = (data.region || '') + ' / ' + (data.city || '');
        document.getElementById('info3').textContent = data.org || data.isp || '未知';
        document.getElementById('info4').textContent = data.latitude ? `${data.latitude}, ${data.longitude}` : '--';
        document.getElementById('ipDesc').textContent = `IP归属地查询结果`;
      } catch (e) {
        document.getElementById('info1').textContent = '中国';
        document.getElementById('info2').textContent = '广东省 / 深圳市';
        document.getElementById('info3').textContent = '本地网络';
        document.getElementById('info4').textContent = '23.12, 113.26';
        document.getElementById('ipDesc').textContent = '（模拟数据，仅供参考）';
      }
    }
    async function lookupMyIP() {
      document.getElementById('ipInput').value = '';
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        document.getElementById('ipInput').value = data.ip;
        await lookupIP(data.ip);
      } catch (e) {
        document.getElementById('ipInput').value = '127.0.0.1';
        await lookupIP('127.0.0.1');
      }
    }
  </script>
</body>
</html>
